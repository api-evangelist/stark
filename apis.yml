aid: stark
name: Stark
description: >-
  Stark is a digital accessibility compliance platform used by more than 50,000
  companies as their accessibility infrastructure across the entire software
  product lifecycle, from issue detection and remediation to insights and
  governance. Stark ships design-tool plug-ins for Figma, Sketch, and Adobe XD,
  browser extensions for Chrome, Firefox, Edge, Safari, Arc, and Brave, a web
  dashboard for project management and real-time reporting, and a Compliance
  Center for managing accessibility posture against regulatory frameworks such
  as WCAG, ADA, and the European Accessibility Act. Stark does not currently
  publish a public developer API; this profile captures its identity and the
  security, trust, and operational-transparency surfaces it publishes.
